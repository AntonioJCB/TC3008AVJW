services:
  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    env_file:
      - path: backend/.env
        required: true
    environment:
      THEHARVESTER_BIN: /opt/theHarvester/.venv/bin/theHarvester
      SPIDERFOOT_URL: http://spiderfoot:5001
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).close()"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 20s
    depends_on:
      spiderfoot:
        condition: service_healthy
    restart: unless-stopped

  spiderfoot:
    build:
      context: .
      dockerfile: deploy/spiderfoot.Dockerfile
    ports:
      - "127.0.0.1:5001:5001"
    volumes:
      - spiderfoot-data:/var/lib/spiderfoot
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/', timeout=5).close()"]
      interval: 15s
      timeout: 8s
      retries: 8
      start_period: 45s
    restart: unless-stopped

volumes:
  spiderfoot-data:
